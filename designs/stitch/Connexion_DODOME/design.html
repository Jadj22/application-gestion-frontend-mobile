<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<style>
        .halo-shadow {
            box-shadow: 0 20px 50px rgba(16, 42, 58, 0.05);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(108, 142, 164, 0.3), 0 10px 30px rgba(16, 42, 58, 0.08);
            border-color: #6C8EA4;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-center items-center p-margin-mobile">
<!-- Mobile Container (Max 390px for preview, acts as full screen on actual device) -->
<main class="w-full max-w-[390px] mx-auto min-h-[844px] relative flex flex-col pt-12 pb-8 px-6">
<!-- Abstract Ambient Background Graphic -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none rounded-[3rem]">
<div class="absolute top-[-10%] right-[-20%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[60px]"></div>
<div class="absolute bottom-[20%] left-[-10%] w-[250px] h-[250px] bg-secondary/5 rounded-full blur-[50px]"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 flex-1 flex flex-col">
<!-- Brand Logo -->
<div class="mb-12">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">DODOME</h1>
</div>
<!-- Headers -->
<div class="mb-10 flex flex-col gap-3">
<h2 class="font-headline-md text-headline-md text-on-surface">Gérez votre stock sans friction</h2>
<p class="font-body-md text-body-md text-on-surface-variant">L'élégance et la précision au service de votre inventaire B2B.</p>
</div>
<!-- Login Form (Glassmorphism Card) -->
<div class="glass-panel rounded-xl p-6 halo-shadow flex flex-col gap-6 mb-8 relative">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Adresse email</label>
<div class="relative h-14 bg-surface/50 rounded-full border border-secondary/10 input-focus-ring transition-all duration-300 flex items-center px-5">
<span class="material-symbols-outlined text-outline-variant mr-3 text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0" id="email" placeholder="nom@entreprise.fr" type="email"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="h-14 w-full bg-on-surface text-surface rounded-full flex items-center justify-center gap-2 hover:bg-on-surface/90 active:scale-[0.98] transition-all duration-200 halo-shadow group mt-2">
<span class="font-body-md text-body-md font-medium">Se connecter avec email</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Separator -->
<div class="flex items-center gap-4 mb-8 px-4">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-label-caps text-label-caps text-outline-variant">OU</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- Secondary Action (Google) -->
<button class="h-14 w-full glass-panel rounded-full flex items-center justify-center gap-3 hover:bg-surface-bright active:scale-[0.98] transition-all duration-200 text-on-surface border border-secondary/10 mb-auto">
<!-- SVG Google Icon (Simplified) -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-body-md text-body-md font-medium">Continuer avec Google</span>
</button>
<!-- Footer Link -->
<div class="mt-8 text-center pb-4">
<a class="font-body-md text-body-md text-primary font-medium hover:text-primary-fixed-dim transition-colors relative inline-block after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-full after:h-px after:bg-primary/30 after:hover:bg-primary after:transition-colors" href="#">Créer un compte</a>
</div>
</div>
</main>
</body></html>
